<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <title id="t">Quick measurement diagram</title>
  <desc id="d">Diagram labeling length along house, projection out from house, and optional height.</desc>
  <rect width="1200" height="900" fill="#eef3f7"/>
  <rect x="160" y="210" width="880" height="500" rx="30" ry="30" fill="#ffffff" stroke="#c6d2dd" stroke-width="6"/>
  <rect x="300" y="300" width="620" height="300" rx="18" ry="18" fill="#dfe8f0" stroke="#95a8b9" stroke-width="4"/>
  <line x1="300" y1="640" x2="920" y2="640" stroke="#3f5f7d" stroke-width="6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="960" y1="300" x2="960" y2="600" stroke="#3f5f7d" stroke-width="6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="250" y1="300" x2="250" y2="640" stroke="#3f5f7d" stroke-width="6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f5f7d"/>
    </marker>
  </defs>
  <text x="610" y="680" text-anchor="middle" fill="#2f4962" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Length along house</text>
  <text x="1000" y="460" text-anchor="middle" fill="#2f4962" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" transform="rotate(90 1000 460)">Projection out</text>
  <text x="205" y="485" text-anchor="middle" fill="#2f4962" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" transform="rotate(90 205 485)">Height optional</text>
</svg>
