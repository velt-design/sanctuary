name: Marketing Accessibility

on:
  pull_request:
    paths:
      - ".github/workflows/accessibility.yml"
      - "apps/marketing/**"
      - "package-lock.json"
      - "package.json"
      - "playwright.marketing.config.ts"
      - "playwright/marketing.accessibility.spec.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/accessibility.yml"
      - "apps/marketing/**"
      - "package-lock.json"
      - "package.json"
      - "playwright.marketing.config.ts"
      - "playwright/marketing.accessibility.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    name: Serious accessibility violations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility gate
        run: npm run test:marketing:accessibility
