name: Lighthouse Guardrails

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - mobile
          - desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          configPath: ./.lighthouserc.${{ matrix.profile }}.json
          uploadArtifacts: true
          temporaryPublicStorage: true
