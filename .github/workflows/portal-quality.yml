name: Portal Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  portal-quality:
    name: Portal Quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PORTAL_TEST_EMAIL: ${{ secrets.PORTAL_TEST_EMAIL }}
      PORTAL_TEST_PASSWORD: ${{ secrets.PORTAL_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Agent docs guard
        run: npm run docs:guard

      - name: Docs impact advisory
        continue-on-error: true
        run: npm run docs:impact

      - name: Readiness aging report
        continue-on-error: true
        run: npm run docs:readiness

      - name: Architecture changed advisory
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          ARCHITECTURE_CHANGED_BASE: origin/${{ github.base_ref }}
          ARCHITECTURE_CHANGED_HEAD: HEAD
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          npm run architecture:changed

      - name: Architecture strict new-growth advisory
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          ARCHITECTURE_CHANGED_BASE: origin/${{ github.base_ref }}
          ARCHITECTURE_CHANGED_HEAD: HEAD
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          npm run architecture:changed:strict

      - name: Files decomposition strict gate
        if: github.event_name == 'pull_request'
        env:
          ARCHITECTURE_CHANGED_BASE: origin/${{ github.base_ref }}
          ARCHITECTURE_CHANGED_HEAD: HEAD
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          npm run files:changed:strict

      - name: Dead code changed advisory
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          ARCHITECTURE_CHANGED_BASE: origin/${{ github.base_ref }}
          ARCHITECTURE_CHANGED_HEAD: HEAD
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          npm run dead-code:changed

      - name: Repository typecheck
        run: npm run typecheck

      - name: Repository lint
        run: npm run lint

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Portal Vitest suite
        run: npm run test:portal

      - name: Portal Project Work V2 contract gate
        run: npm run test:portal:project-work

      - name: Portal production build
        run: npm run build:portal

      - name: Portal route bundle budgets
        run: npm run portal:bundle-budget

      - name: Production security audit
        run: npm run audit:security

      - name: Portal fixture browser smoke
        run: npm run test:portal:browser

      - name: Fixture-safe interaction performance
        if: always()
        run: npm run test:portal:performance:fixture

      - name: Upload fixture performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-fixture-performance
          path: |
            artifacts/portal-workbench-performance.json
            artifacts/portal-project-mutation-performance.json
          if-no-files-found: warn

      - name: Authenticated browser gate prerequisites
        run: |
          {
            echo "## Authenticated Portal Gates"
            echo
            echo "The authenticated smoke gate is intentionally blocking. It requires:"
            echo
            echo "- PORTAL_TEST_EMAIL and PORTAL_TEST_PASSWORD repository secrets"
            echo "- an active staff or admin portal role for the test account"
            echo "- Schedule V2 readiness returning ok: true"
            echo "- at least one project visible to the test account"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Portal authenticated smoke suite
        id: portal_auth_smoke
        run: npm run test:portal:smoke

      - name: Authenticated smoke failure guidance
        if: ${{ failure() && steps.portal_auth_smoke.outcome == 'failure' }}
        run: |
          {
            echo
            echo "### Authenticated Smoke Failure"
            echo
            echo "This gate must not silently skip. Confirm PORTAL_TEST_EMAIL and PORTAL_TEST_PASSWORD are configured, the test account has staff/admin access, schedule readiness is green, and seeded project data is visible."
          } >> "$GITHUB_STEP_SUMMARY"

  portal-performance:
    name: Portal Performance Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PORTAL_TEST_EMAIL: ${{ secrets.PORTAL_TEST_EMAIL }}
      PORTAL_TEST_PASSWORD: ${{ secrets.PORTAL_TEST_PASSWORD }}
      PORTAL_PLAYWRIGHT_PRODUCTION: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portal for production timing
        run: npm run build:portal

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Performance gate prerequisites
        run: |
          {
            echo "## Portal Performance Gate"
            echo
            echo "The route-performance gate is intentionally blocking. It runs the authenticated runtime preflight before timing routes and requires:"
            echo
            echo "- PORTAL_TEST_EMAIL and PORTAL_TEST_PASSWORD repository secrets"
            echo "- an active staff or admin portal role for the test account"
            echo "- Schedule V2 readiness returning ok: true"
            echo "- at least one project visible to the test account"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture five portal performance runs
        id: portal_performance
        run: |
          mkdir -p artifacts/portal-performance
          npm run portal:auth-runtime
          for run in 1 2 3 4 5; do
            echo "Authenticated performance repetition ${run}/5"
            PORTAL_PERF_ARTIFACT="artifacts/portal-performance/run-${run}.json" npm run test:portal:performance:capture
          done

      - name: Portal performance failure guidance
        if: ${{ failure() && steps.portal_performance.outcome == 'failure' }}
        run: |
          {
            echo
            echo "### Portal Performance Failure"
            echo
            echo "This gate must not silently skip. Confirm authenticated runtime prerequisites first, then inspect the route timing artifact if one was generated."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate and publish performance baseline
        if: always()
        run: node scripts/summarize-portal-performance.mjs artifacts/portal-performance

      - name: Upload portal timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-performance-baseline
          path: artifacts/portal-performance/*.json
          if-no-files-found: warn
