name: Docs Health

on:
  schedule:
    - cron: "0 17 * * 2"
  workflow_dispatch:

jobs:
  docs-health:
    name: Docs Health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Agent docs guard
        run: npm run docs:guard

      - name: Mojibake check
        run: npm run text:mojibake

      - name: Docs impact advisory
        continue-on-error: true
        run: npm run docs:impact

      - name: Readiness aging report
        continue-on-error: true
        run: npm run docs:readiness

      - name: Docs navigation report
        continue-on-error: true
        run: npm run docs:navigation
